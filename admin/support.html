<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PROPulsion Admin · Support</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="shortcut icon" href="/assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/admin/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth-guard.js"></script>
<script src="/admin-guard.js"></script>
<script src="/admin/crm-shared.js"></script>
</head>
<body class="theme-light">

<div id="state-loading"><p class="hint" style="padding:1.5rem">Loading…</p></div>

<div class="shell" id="app">
  <div id="admin-nav-root" data-active="support"></div>
  <script src="/admin/admin-nav.js"></script>

  <p class="page-title">Support</p>

  <div class="crm-panel">
    <p class="subhead">Support requests</p>
    <p class="hint" style="margin:-.4rem 0 1rem">Sent from the Contact us button in the app, newest first. Changing a status saves straight away.</p>

    <div class="filter-bar">
      <div class="field"><label>Status</label>
        <select id="filter-status" onchange="loadRequests()">
          <option value="">All</option>
          <option value="new">New</option>
          <option value="in_progress">In progress</option>
          <option value="resolved">Resolved</option>
        </select>
      </div>
      <div class="field"><label>Category</label>
        <select id="filter-category" onchange="loadRequests()">
          <option value="">All</option>
          <option value="Bug">Bug</option>
          <option value="Question">Question</option>
          <option value="Feature idea">Feature idea</option>
          <option value="Billing">Billing</option>
        </select>
      </div>
    </div>

    <div class="crm-table-wrap">
      <table class="crm-table support-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>User email</th>
            <th>Category</th>
            <th>Trying to do</th>
            <th>What happened</th>
            <th>Page</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="support-tbody"><tr><td colspan="7" class="hint">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let sbClient=null, currentSession=null;

const SUPPORT_STATUS_LABELS={new:'New',in_progress:'In progress',resolved:'Resolved'};

function tokenHeader(){ return {'Authorization':'Bearer '+currentSession.access_token}; }
async function apiGet(path){
  const res=await fetch(path,{headers:tokenHeader()});
  const body=await res.json();
  if(!res.ok) throw new Error(body.error||'Request failed.');
  return body;
}
async function apiSend(path,method,payload){
  const res=await fetch(path,{method,headers:{...tokenHeader(),'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const body=await res.json();
  if(!res.ok) throw new Error(body.error||'Request failed.');
  return body;
}

// Shows just the path (e.g. "/index.html") with the full URL as the link,
// since every page_url is on our own domain and the path is what matters.
// page_url is sent by the user's browser, so it's untrusted: it only
// becomes a link if it parses as http(s). Anything else (a crafted
// "javascript:" URL, say) is shown as plain escaped text, never clickable.
function renderPageCell(url){
  if(!url) return '<span class="hint">None</span>';
  let parsed=null;
  try{ parsed=new URL(url); }catch(e){}
  if(!parsed || (parsed.protocol!=='http:' && parsed.protocol!=='https:')){
    return '<span class="muted-cell">'+crmEscapeHtml(url)+'</span>';
  }
  return '<a href="'+crmEscapeAttr(parsed.href)+'" target="_blank" rel="noopener">'+crmEscapeHtml(parsed.pathname+parsed.search)+'</a>';
}

function renderStatusSelect(r){
  const opts=Object.keys(SUPPORT_STATUS_LABELS).map(k=>
    '<option value="'+k+'"'+(k===r.status?' selected':'')+'>'+SUPPORT_STATUS_LABELS[k]+'</option>'
  ).join('');
  return '<div class="field support-status-field"><select onchange="updateStatus(\''+r.id+'\',this)" data-prev="'+crmEscapeAttr(r.status)+'">'+opts+'</select></div>'+
    '<p class="save-msg" id="status-msg-'+r.id+'"></p>';
}

function renderRow(r){
  return '<tr>'+
    '<td class="muted-cell support-nowrap">'+crmFmtDateTime(r.created_at)+'</td>'+
    '<td>'+crmEscapeHtml(r.email)+'</td>'+
    '<td><span class="stage-pill">'+crmEscapeHtml(r.category)+'</span></td>'+
    '<td class="support-text">'+crmEscapeHtml(r.trying_to_do)+'</td>'+
    '<td class="support-text">'+crmEscapeHtml(r.what_happened)+
      (r.has_screenshot?'<div style="margin-top:.4rem"><button class="mini-btn" onclick="viewScreenshot(\''+r.id+'\',this)">View screenshot</button></div>':'')+
    '</td>'+
    '<td class="support-nowrap">'+renderPageCell(r.page_url)+'</td>'+
    '<td>'+renderStatusSelect(r)+'</td>'+
  '</tr>';
}

async function loadRequests(){
  const tbody=document.getElementById('support-tbody');
  const params=new URLSearchParams();
  const status=document.getElementById('filter-status').value;
  const category=document.getElementById('filter-category').value;
  if(status)params.set('status',status);
  if(category)params.set('category',category);

  try{
    const data=await apiGet('/api/admin/support-requests'+(params.toString()?'?'+params.toString():''));
    setAdminSupportCount(data.open_count);
    if(!data.requests.length){
      tbody.innerHTML='<tr><td colspan="7" class="hint">'+(status||category?'No support requests match these filters.':'No support requests yet.')+'</td></tr>';
      return;
    }
    tbody.innerHTML=data.requests.map(renderRow).join('');
  }catch(e){
    tbody.innerHTML='<tr><td colspan="7" class="save-msg error">'+crmEscapeHtml(e.message)+'</td></tr>';
  }
}

async function updateStatus(id, select){
  const msg=document.getElementById('status-msg-'+id);
  const prev=select.dataset.prev;
  msg.textContent='Saving…';msg.className='save-msg';
  select.disabled=true;
  try{
    const body=await apiSend('/api/admin/support-requests/'+id+'/status','PUT',{status:select.value});
    select.dataset.prev=select.value;
    msg.textContent='Saved';
    if(typeof body.open_count==='number') setAdminSupportCount(body.open_count);
  }catch(e){
    select.value=prev;
    msg.textContent=e.message;msg.className='save-msg error';
  }finally{
    select.disabled=false;
  }
}

// The window is opened synchronously on click, before the await, so popup
// blockers treat it as user-initiated; it's then pointed at the signed URL
// (valid for 60 seconds) once that comes back.
async function viewScreenshot(id, btn){
  const win=window.open('','_blank');
  btn.disabled=true;
  try{
    const body=await apiGet('/api/admin/support-requests/'+id+'/screenshot-url');
    if(win){ win.opener=null; win.location.href=body.url; }
    else window.location.href=body.url;
  }catch(e){
    if(win) win.close();
    const msg=document.getElementById('status-msg-'+id);
    if(msg){ msg.textContent='Screenshot: '+e.message; msg.className='save-msg error'; }
  }finally{
    btn.disabled=false;
  }
}

async function init(){
  const auth=await requireSuperuser();
  if(!auth)return;
  sbClient=auth.client;
  currentSession=auth.session;

  document.getElementById('state-loading').style.display='none';
  document.getElementById('app').style.display='block';

  loadRequests();
}
init();
</script>
</body>
</html>
