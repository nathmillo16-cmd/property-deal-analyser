<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#4b45b2">
<title>Offline · PROPulsion</title>
<meta name="apple-mobile-web-app-title" content="PROPulsion">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<style>
  html,body{margin:0;padding:0;height:100%}
  body{
    background:#F2EFE7;color:#1c1c1a;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    box-sizing:border-box;
  }
  .card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:32px 24px;max-width:380px;width:100%;text-align:center}
  img{width:64px;height:64px;border-radius:14px}
  h1{font-size:20px;margin:16px 0 8px}
  p{font-size:15px;line-height:1.55;color:#6b6b66;margin:0 0 24px}
  button{
    font:inherit;font-weight:600;font-size:16px;color:#fff;background:#4b45b2;
    border:0;border-radius:8px;min-height:44px;padding:0 24px;cursor:pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="/assets/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>PROPulsion needs an internet connection to load your deals. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
