<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Deals N Yields — Saved Deals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth-guard.js"></script>
<style>
/* page-specific layout only — colours/fonts/radius all come from styles.css */
#app{display:none}

.hint{font-size:12.5px;color:var(--muted);font-style:italic}

.page-title{font-family:var(--font-head);font-weight:800;font-size:28px;margin:0 0 1.5rem}

.saved-panel-inner{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius);padding:1.75rem;max-width:760px}
.saved-item{display:flex;justify-content:space-between;align-items:center;padding:.85rem 1rem;border:1px solid var(--hairline);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--surface-2);gap:1rem;flex-wrap:wrap}
.saved-info{display:flex;flex-direction:column;gap:2px}
.saved-name{font-size:14px;font-weight:700;color:var(--ink);font-family:var(--font-body)}
.saved-detail{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.saved-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mini-btn{font-family:var(--font-body);font-size:11.5px;font-weight:600;color:var(--accent);background:transparent;border:1.5px solid var(--accent);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.mini-btn:hover{background:rgba(224,164,88,.08)}
.mini-btn:disabled{opacity:.4;cursor:not-allowed}
.mini-btn.danger{color:#E8746B;border-color:#E8746B}
.mini-btn.danger:hover{background:rgba(232,116,107,.08)}
.pipeline-badge{font-family:var(--font-body);font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--hairline);border-radius:999px;padding:5px 12px;white-space:nowrap;text-transform:capitalize}

.bulk-bar{display:flex;align-items:center;gap:1.25rem;margin-bottom:1rem;flex-wrap:wrap}
.select-all-label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);font-weight:600;cursor:pointer;font-family:var(--font-body)}
.saved-select{display:flex;align-items:center}
</style>
</head>
<body>

<div class="shell" id="app">
  <div class="topbar">
    <span class="wordmark">Deals N Yields</span>
    <div class="nav-links"><a href="/home.html">Home</a><a href="/index.html">Calculator</a><a href="/saved-deals.html" class="active">Saved Deals</a><a href="/pipeline.html">Pipeline</a></div>
    <div class="auth-bar"><a id="auth-link" href="#">Log out</a></div>
  </div>

  <p class="page-title">Saved Deals</p>

  <div class="saved-panel-inner">
    <div class="bulk-bar" id="bulk-bar" style="display:none">
      <label class="select-all-label"><input type="checkbox" id="select-all" onchange="toggleSelectAll(this.checked)"/> Select all</label>
      <span class="hint" id="bulk-count">0 selected</span>
      <button class="mini-btn danger" id="bulk-delete-btn" disabled onclick="deleteSelected()">Delete selected</button>
    </div>
    <div id="saved-list"><p class="hint">Loading…</p></div>
  </div>
</div>

<script>
let sbClient=null, currentSession=null;
let savedDealsCache=[];
let selectedForDelete=new Set();

function fmt(n){return'£'+Math.round(n).toLocaleString();}

function escapeHtml(s){
  const div=document.createElement('div');
  div.textContent=s;
  return div.innerHTML;
}

function fallbackName(d){
  const label=d.deal_type.toUpperCase();
  const date=new Date(d.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const pp=d.deal_data&&d.deal_data.pp?fmt(d.deal_data.pp):null;
  return pp?`${label} — ${pp} — ${date}`:`${label} — ${date}`;
}

function dealDisplayName(d){
  return (d.deal_data&&d.deal_data.name)?d.deal_data.name:fallbackName(d);
}

function capitalize(s){return s.charAt(0).toUpperCase()+s.slice(1);}

function joinNatural(items){
  if(items.length===1)return items[0];
  if(items.length===2)return items[0]+' and '+items[1];
  return items.slice(0,-1).join(', ')+', and '+items[items.length-1];
}

async function logout(){
  await sbClient.auth.signOut();
  window.location.href='/';
}

async function loadSavedDeals(){
  const listEl=document.getElementById('saved-list');
  listEl.innerHTML='<p class="hint">Loading…</p>';
  try{
    const res=await fetch('/api/deals',{headers:{'Authorization':'Bearer '+currentSession.access_token}});
    const deals=await res.json();
    if(!res.ok)throw new Error(deals.error||'Could not load saved deals.');
    savedDealsCache=Array.isArray(deals)?deals:[];

    const stillPresent=new Set(savedDealsCache.map(d=>d.id));
    selectedForDelete.forEach(id=>{ if(!stillPresent.has(id)) selectedForDelete.delete(id); });

    document.getElementById('bulk-bar').style.display=savedDealsCache.length>0?'flex':'none';

    if(savedDealsCache.length===0){
      listEl.innerHTML='<p class="hint">No saved deals yet.</p>';
      updateBulkBar();
      return;
    }
    listEl.innerHTML=savedDealsCache.map(d=>{
      const date=new Date(d.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
      const label=d.deal_type.toUpperCase();
      const pp=d.deal_data&&d.deal_data.pp?fmt(d.deal_data.pp):'';
      const name=dealDisplayName(d);
      const action=d.pipeline_stage
        ?`<span class="pipeline-badge">In pipeline · ${d.pipeline_stage}</span>`
        :`<button class="mini-btn" onclick="addToPipeline('${d.id}')">Add to pipeline</button>`;
      const checked=selectedForDelete.has(d.id)?'checked':'';
      return `<div class="saved-item">
        <label class="saved-select"><input type="checkbox" data-deal-id="${d.id}" ${checked} onchange="toggleSelect('${d.id}', this.checked)"/></label>
        <div class="saved-info">
          <span class="saved-name">${escapeHtml(name)}</span>
          <span class="saved-detail">${label}${pp?' · '+pp:''} · ${date}</span>
        </div>
        <div class="saved-controls">
          ${action}
          <button class="mini-btn" onclick="renameDeal('${d.id}')">Rename</button>
          <button class="mini-btn danger" onclick="deleteDeal('${d.id}')">Delete</button>
        </div>
      </div>`;
    }).join('');
    updateBulkBar();
    document.getElementById('select-all').checked=savedDealsCache.every(d=>selectedForDelete.has(d.id));
  }catch(e){
    listEl.innerHTML='<p class="hint">Could not load saved deals.</p>';
  }
}

function toggleSelect(dealId, checked){
  if(checked)selectedForDelete.add(dealId); else selectedForDelete.delete(dealId);
  document.getElementById('select-all').checked=savedDealsCache.length>0&&savedDealsCache.every(d=>selectedForDelete.has(d.id));
  updateBulkBar();
}

function toggleSelectAll(checked){
  selectedForDelete=new Set();
  document.querySelectorAll('.saved-select input[type=checkbox]').forEach(cb=>{
    cb.checked=checked;
    if(checked)selectedForDelete.add(cb.dataset.dealId);
  });
  updateBulkBar();
}

function updateBulkBar(){
  const count=selectedForDelete.size;
  document.getElementById('bulk-count').textContent=count+' selected';
  document.getElementById('bulk-delete-btn').disabled=count===0;
}

async function deleteSelected(){
  const ids=[...selectedForDelete];
  if(ids.length===0)return;

  const inPipelineDeals=savedDealsCache.filter(d=>ids.includes(d.id)&&d.pipeline_stage);
  let msg=`Delete ${ids.length} deal${ids.length===1?'':'s'}?`;
  if(inPipelineDeals.length>0){
    const named=inPipelineDeals.map(d=>`"${dealDisplayName(d)}" (${capitalize(d.pipeline_stage)})`);
    const verb=inPipelineDeals.length===1?'is':'are';
    const pronoun=inPipelineDeals.length===1?'it':'them';
    msg+=`\n\n${joinNatural(named)} ${verb} in your pipeline — deleting removes ${pronoun} from there too.`;
  }
  if(!confirm(msg))return;

  const btn=document.getElementById('bulk-delete-btn');
  btn.disabled=true;btn.textContent='Deleting...';

  try{
    const results=await Promise.all(ids.map(id=>
      fetch(`/api/deals/${id}/delete`,{method:'POST',headers:{'Authorization':'Bearer '+currentSession.access_token}})
        .then(r=>r.json().then(body=>({ok:r.ok,body})))
        .catch(e=>({ok:false,body:{error:e.message}}))
    ));
    const failed=results.filter(r=>!r.ok);
    selectedForDelete=new Set();
    await loadSavedDeals();
    if(failed.length>0){
      alert(`${failed.length} of ${ids.length} deal(s) could not be deleted.`);
    }
  }catch(e){
    alert('Could not delete selected deals: '+e.message);
  }

  btn.disabled=false;btn.textContent='Delete selected';
}

async function addToPipeline(dealId){
  if(!currentSession)return;
  try{
    const res=await fetch('/api/pipeline',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+currentSession.access_token},
      body:JSON.stringify({deal_id:dealId})
    });
    const body=await res.json();
    if(!res.ok)throw new Error(body.error||'Could not add to pipeline.');
    loadSavedDeals();
  }catch(e){
    alert('Could not add to pipeline: '+e.message);
  }
}

async function renameDeal(dealId){
  if(!currentSession)return;
  const deal=savedDealsCache.find(d=>d.id===dealId);
  const currentName=deal?dealDisplayName(deal):'';
  const newName=prompt('Rename this deal:', currentName);
  if(newName===null)return;
  try{
    const res=await fetch(`/api/deals/${dealId}/name`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+currentSession.access_token},
      body:JSON.stringify({name:newName.trim()})
    });
    const body=await res.json();
    if(!res.ok)throw new Error(body.error||'Could not rename deal.');
    loadSavedDeals();
  }catch(e){
    alert('Could not rename deal: '+e.message);
  }
}

async function deleteDeal(dealId){
  if(!currentSession)return;
  const deal=savedDealsCache.find(d=>d.id===dealId);
  const msg=(deal&&deal.pipeline_stage)
    ?`"${dealDisplayName(deal)}" (${capitalize(deal.pipeline_stage)}) is in your pipeline — deleting removes it from there too. Delete anyway?`
    :'Delete this saved deal?';
  if(!confirm(msg))return;
  try{
    const res=await fetch(`/api/deals/${dealId}/delete`,{
      method:'POST',
      headers:{'Authorization':'Bearer '+currentSession.access_token}
    });
    const body=await res.json();
    if(!res.ok)throw new Error(body.error||'Could not delete deal.');
    loadSavedDeals();
  }catch(e){
    alert('Could not delete deal: '+e.message);
  }
}

async function init(){
  const auth=await requireAuth();
  if(!auth)return;
  sbClient=auth.client;
  currentSession=auth.session;

  document.getElementById('auth-link').onclick=function(e){e.preventDefault();logout();};
  document.getElementById('app').style.display='block';

  loadSavedDeals();

  sbClient.auth.onAuthStateChange((_event, session)=>{
    currentSession=session;
    if(!currentSession){window.location.href='/';return;}
  });
}

init();
</script>
</body>
</html>
