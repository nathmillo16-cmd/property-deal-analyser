<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Deals N Yields — Saved Deals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth-guard.js"></script>
<style>
/* page-specific layout only — colours/fonts/radius all come from styles.css */
#app{display:none}

.hint{font-size:12.5px;color:var(--muted);font-style:italic}

.page-title{font-family:var(--font-head);font-weight:800;font-size:28px;margin:0 0 1.5rem}

.saved-panel-inner{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius);padding:1.75rem;max-width:760px}
.saved-item{display:flex;justify-content:space-between;align-items:center;padding:.85rem 1rem;border:1px solid var(--hairline);border-radius:var(--radius-sm);margin-bottom:8px;background:var(--surface-2);gap:1rem;flex-wrap:wrap}
.saved-info{display:flex;flex-direction:column;gap:2px}
.saved-name{font-size:14px;font-weight:700;color:var(--ink);font-family:var(--font-body)}
.saved-detail{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.saved-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mini-btn{font-family:var(--font-body);font-size:11.5px;font-weight:600;color:var(--accent);background:transparent;border:1.5px solid var(--accent);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.mini-btn:hover{background:rgba(224,164,88,.08)}
.mini-btn:disabled{opacity:.4;cursor:not-allowed}
.mini-btn.danger{color:#E8746B;border-color:#E8746B}
.mini-btn.danger:hover{background:rgba(232,116,107,.08)}
.pipeline-badge{font-family:var(--font-body);font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--hairline);border-radius:999px;padding:5px 12px;white-space:nowrap;text-transform:capitalize}

.bulk-bar{display:flex;align-items:center;gap:1.25rem;margin-bottom:1rem;flex-wrap:wrap}
.select-all-label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);font-weight:600;cursor:pointer;font-family:var(--font-body)}
.saved-select{display:flex;align-items:center}

.save-msg{font-size:12px;margin:.5rem 0 0;min-height:1em;color:var(--muted)}
.save-msg.success{color:var(--accent-2)}
.save-msg.error{color:#E8746B}
.save-msg a{color:inherit;font-weight:600;text-decoration:underline}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;align-items:center;justify-content:center;padding:1rem}
.modal-overlay.open{display:flex}
.modal-card{max-width:480px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-header{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1rem}
.modal-header h2{font-size:18px;margin:0;word-break:break-word}
.modal-close{background:transparent;border:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:0 4px;flex-shrink:0}
.modal-close:hover{color:var(--ink)}
.modal-actions{display:flex;justify-content:flex-end;margin-top:1rem}
</style>
</head>
<body>

<div class="shell" id="app">
  <div class="topbar">
    <a class="wordmark" href="/home.html">Deals N Yields</a>
    <div class="nav-links"><a href="/home.html">Home</a><a href="/index.html">Calculator</a><a href="/saved-deals.html" class="active">Saved Deals</a><a href="/pipeline.html">Pipeline</a><a href="/portfolio.html">Portfolio</a><a href="/refurb.html">Refurb Estimator</a></div>
    <div class="auth-bar"><a id="auth-link" href="#">Log out</a></div>
  </div>

  <p class="page-title">Saved Deals</p>

  <div class="saved-panel-inner">
    <div class="bulk-bar" id="bulk-bar" style="display:none">
      <label class="select-all-label"><input type="checkbox" id="select-all" onchange="toggleSelectAll(this.checked)"/> Select all</label>
      <span class="hint" id="bulk-count">0 selected</span>
      <button class="mini-btn danger" id="bulk-delete-btn" disabled onclick="deleteSelected()">Delete selected</button>
    </div>
    <div id="saved-list"><p class="hint">Loading…</p></div>
  </div>
</div>

<div class="modal-overlay" id="mtp-modal-overlay" onclick="handleMtpOverlayClick(event)">
  <div class="card modal-card">
    <div class="modal-header">
      <h2>Move to portfolio</h2>
      <button class="modal-close" onclick="closeMoveToPortfolio()" aria-label="Close">×</button>
    </div>
    <p class="hint" style="margin-bottom:1rem">Pre-filled from this deal where possible. Review and fill in any gaps before adding it.</p>
    <div class="field"><label>Address</label><input type="text" id="mtp-address"/></div>
    <div class="field"><label>Price paid (£)</label><input type="number" id="mtp-price"/></div>
    <div class="field"><label>Property type</label>
      <div class="dd" id="mtp-type" data-value="BTL">
        <button type="button" class="dd-trigger" aria-haspopup="listbox" aria-expanded="false" onclick="toggleDD(event,'mtp-type')" onkeydown="ddKeydown(event,'mtp-type')">
          <span>BTL</span>
        </button>
        <ul class="dd-list" role="listbox">
          <li class="dd-opt selected" role="option" aria-selected="true" data-value="BTL" onclick="selectDDOption(event,'mtp-type','BTL','BTL')">BTL</li>
          <li class="dd-opt" role="option" aria-selected="false" data-value="HMO" onclick="selectDDOption(event,'mtp-type','HMO','HMO')">HMO</li>
          <li class="dd-opt" role="option" aria-selected="false" data-value="SA" onclick="selectDDOption(event,'mtp-type','SA','SA')">SA</li>
          <li class="dd-opt" role="option" aria-selected="false" data-value="Flip" onclick="selectDDOption(event,'mtp-type','Flip','Flip')">Flip</li>
        </ul>
      </div>
    </div>
    <div class="field"><label>Monthly rent (£)</label><input type="number" id="mtp-rent"/></div>
    <div class="field"><label>Monthly running costs (£)</label><input type="number" id="mtp-costs"/></div>
    <div class="field"><label>Monthly mortgage (£)</label><input type="number" id="mtp-mortgage" placeholder="Leave blank if no mortgage"/></div>
    <p class="save-msg" id="mtp-msg"></p>
    <div class="modal-actions">
      <button class="btn-primary" id="mtp-confirm-btn" onclick="confirmMoveToPortfolio()">Add to portfolio</button>
    </div>
  </div>
</div>

<script>
// Custom themed dropdown, replacing native <select> — same visual treatment
// and interaction mechanics as pipeline.html's original stage-dd component
// (which stays as its own separate, untouched implementation there),
// generalized so it can back any value+options picker. A <select>'s .value
// has no equivalent once it's gone, so the wrapper div carries the current
// value in data-value instead, keyed by the same id the old <select> had —
// getDDValue/setDDValue read/write it.
let openDD=null;

function closeAllDD(){
  document.querySelectorAll('.dd.open').forEach(el=>{
    el.classList.remove('open');
    const btn=el.querySelector('.dd-trigger');
    if(btn)btn.setAttribute('aria-expanded','false');
  });
  openDD=null;
}

function positionDDList(wrap){
  const trigger=wrap.querySelector('.dd-trigger');
  const list=wrap.querySelector('.dd-list');
  if(!trigger||!list)return;
  const r=trigger.getBoundingClientRect();
  const gap=4;
  const listHeight=list.getBoundingClientRect().height;
  const spaceBelow=window.innerHeight-r.bottom, spaceAbove=r.top;
  const openUpward=spaceBelow<(listHeight+gap) && spaceAbove>=(listHeight+gap);
  list.style.left=r.left+'px';
  list.style.width=r.width+'px';
  list.style.top=openUpward ? (r.top-listHeight-gap)+'px' : (r.bottom+gap)+'px';
}

function toggleDD(e, id){
  e.stopPropagation();
  const wasOpen=openDD===id;
  closeAllDD();
  if(wasOpen)return;
  const wrap=document.getElementById(id);
  if(!wrap)return;
  wrap.classList.add('open');
  wrap.querySelector('.dd-trigger').setAttribute('aria-expanded','true');
  positionDDList(wrap);
  openDD=id;
  wrap.querySelectorAll('.dd-opt').forEach(o=>o.classList.remove('highlight'));
  const current=wrap.querySelector('.dd-opt.selected')||wrap.querySelector('.dd-opt');
  if(current)current.classList.add('highlight');
}

function setDDValue(id, value, label){
  const wrap=document.getElementById(id);
  if(!wrap)return;
  wrap.dataset.value=value;
  const span=wrap.querySelector('.dd-trigger span');
  if(span)span.textContent=label!=null?label:value;
  wrap.querySelectorAll('.dd-opt').forEach(o=>{
    const match=o.dataset.value===String(value);
    o.classList.toggle('selected',match);
    o.setAttribute('aria-selected',match?'true':'false');
  });
}

function getDDValue(id){
  const wrap=document.getElementById(id);
  return wrap?wrap.dataset.value:null;
}

function selectDDOption(e, id, value, label){
  e.stopPropagation();
  closeAllDD();
  setDDValue(id, value, label);
  const wrap=document.getElementById(id);
  const cb=wrap&&wrap.dataset.onchange;
  if(cb&&typeof window[cb]==='function')window[cb](id, value);
}

function ddKeydown(e, id){
  const wrap=document.getElementById(id);
  if(!wrap)return;
  const isOpen=openDD===id;
  if(e.key==='Enter'||e.key===' '){
    e.preventDefault();
    if(!isOpen){toggleDD(e, id);return;}
    const hl=wrap.querySelector('.dd-opt.highlight');
    if(hl)selectDDOption(e, id, hl.dataset.value, hl.textContent);
    return;
  }
  if(e.key==='Escape'){closeAllDD();return;}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    if(!isOpen){toggleDD(e, id);return;}
    const opts=[...wrap.querySelectorAll('.dd-opt')];
    let idx=opts.findIndex(o=>o.classList.contains('highlight'));
    idx = e.key==='ArrowDown' ? Math.min(idx+1, opts.length-1) : Math.max(idx-1, 0);
    opts.forEach(o=>o.classList.remove('highlight'));
    opts[idx].classList.add('highlight');
  }
}

document.addEventListener('click', closeAllDD);
window.addEventListener('scroll', closeAllDD, true);

let sbClient=null, currentSession=null;
let savedDealsCache=[];
let selectedForDelete=new Set();

function fmt(n){return'£'+Math.round(n).toLocaleString();}

function escapeHtml(s){
  const div=document.createElement('div');
  div.textContent=s;
  return div.innerHTML;
}

function fallbackName(d){
  const label=d.deal_type.toUpperCase();
  const date=new Date(d.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const pp=d.deal_data&&d.deal_data.pp?fmt(d.deal_data.pp):null;
  return pp?`${label} — ${pp} — ${date}`:`${label} — ${date}`;
}

function dealDisplayName(d){
  return (d.deal_data&&d.deal_data.name)?d.deal_data.name:fallbackName(d);
}

function capitalize(s){return s.charAt(0).toUpperCase()+s.slice(1);}

function joinNatural(items){
  if(items.length===1)return items[0];
  if(items.length===2)return items[0]+' and '+items[1];
  return items.slice(0,-1).join(', ')+', and '+items[items.length-1];
}

async function logout(){
  await sbClient.auth.signOut();
  window.location.href='/';
}

async function loadSavedDeals(){
  const listEl=document.getElementById('saved-list');
  listEl.innerHTML='<p class="hint">Loading…</p>';
  try{
    const res=await fetch('/api/deals',{headers:{'Authorization':'Bearer '+currentSession.access_token}});
    const deals=await res.json();
    if(!res.ok)throw new Error(deals.error||'Could not load saved deals.');
    savedDealsCache=Array.isArray(deals)?deals:[];

    const stillPresent=new Set(savedDealsCache.map(d=>d.id));
    selectedForDelete.forEach(id=>{ if(!stillPresent.has(id)) selectedForDelete.delete(id); });

    document.getElementById('bulk-bar').style.display=savedDealsCache.length>0?'flex':'none';

    if(savedDealsCache.length===0){
      listEl.innerHTML='<p class="hint">No saved deals yet.</p>';
      updateBulkBar();
      return;
    }
    listEl.innerHTML=savedDealsCache.map(d=>{
      const date=new Date(d.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
      const label=d.deal_type.toUpperCase();
      const pp=d.deal_data&&d.deal_data.pp?fmt(d.deal_data.pp):'';
      const name=dealDisplayName(d);
      const action=d.pipeline_stage
        ?`<span class="pipeline-badge">In pipeline · ${d.pipeline_stage}</span>`
        :`<button class="mini-btn" onclick="addToPipeline('${d.id}')">Add to pipeline</button>`;
      const checked=selectedForDelete.has(d.id)?'checked':'';
      return `<div class="saved-item">
        <label class="saved-select"><input type="checkbox" data-deal-id="${d.id}" ${checked} onchange="toggleSelect('${d.id}', this.checked)"/></label>
        <div class="saved-info">
          <span class="saved-name">${escapeHtml(name)}</span>
          <span class="saved-detail">${label}${pp?' · '+pp:''} · ${date}</span>
        </div>
        <div class="saved-controls">
          ${action}
          <button class="mini-btn" onclick="renameDeal('${d.id}')">Rename</button>
          <button class="mini-btn" onclick="openMoveToPortfolio('${d.id}')">Move to portfolio</button>
          <button class="mini-btn danger" onclick="deleteDeal('${d.id}')">Delete</button>
        </div>
      </div>`;
    }).join('');
    updateBulkBar();
    document.getElementById('select-all').checked=savedDealsCache.every(d=>selectedForDelete.has(d.id));
  }catch(e){
    listEl.innerHTML='<p class="hint">Could not load saved deals.</p>';
  }
}

function toggleSelect(dealId, checked){
  if(checked)selectedForDelete.add(dealId); else selectedForDelete.delete(dealId);
  document.getElementById('select-all').checked=savedDealsCache.length>0&&savedDealsCache.every(d=>selectedForDelete.has(d.id));
  updateBulkBar();
}

function toggleSelectAll(checked){
  selectedForDelete=new Set();
  document.querySelectorAll('.saved-select input[type=checkbox]').forEach(cb=>{
    cb.checked=checked;
    if(checked)selectedForDelete.add(cb.dataset.dealId);
  });
  updateBulkBar();
}

function updateBulkBar(){
  const count=selectedForDelete.size;
  document.getElementById('bulk-count').textContent=count+' selected';
  document.getElementById('bulk-delete-btn').disabled=count===0;
}

async function deleteSelected(){
  const ids=[...selectedForDelete];
  if(ids.length===0)return;

  const inPipelineDeals=savedDealsCache.filter(d=>ids.includes(d.id)&&d.pipeline_stage);
  let msg=`Delete ${ids.length} deal${ids.length===1?'':'s'}?`;
  if(inPipelineDeals.length>0){
    const named=inPipelineDeals.map(d=>`"${dealDisplayName(d)}" (${capitalize(d.pipeline_stage)})`);
    const verb=inPipelineDeals.length===1?'is':'are';
    const pronoun=inPipelineDeals.length===1?'it':'them';
    msg+=`\n\n${joinNatural(named)} ${verb} in your pipeline, so deleting removes ${pronoun} from there too.`;
  }
  if(!confirm(msg))return;

  const btn=document.getElementById('bulk-delete-btn');
  btn.disabled=true;btn.textContent='Deleting...';

  try{
    const results=await Promise.all(ids.map(id=>
      fetch(`/api/deals/${id}/delete`,{method:'POST',headers:{'Authorization':'Bearer '+currentSession.access_token}})
        .then(r=>r.json().then(body=>({ok:r.ok,body})))
        .catch(e=>({ok:false,body:{error:e.message}}))
    ));
    const failed=results.filter(r=>!r.ok);
    selectedForDelete=new Set();
    await loadSavedDeals();
    if(failed.length>0){
      alert(`${failed.length} of ${ids.length} deal(s) could not be deleted.`);
    }
  }catch(e){
    alert('Could not delete selected deals: '+e.message);
  }

  btn.disabled=false;btn.textContent='Delete selected';
}

async function addToPipeline(dealId){
  if(!currentSession)return;
  try{
    const res=await fetch('/api/pipeline',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+currentSession.access_token},
      body:JSON.stringify({deal_id:dealId})
    });
    const body=await res.json();
    if(!res.ok)throw new Error(body.error||'Could not add to pipeline.');
    loadSavedDeals();
  }catch(e){
    alert('Could not add to pipeline: '+e.message);
  }
}

async function renameDeal(dealId){
  if(!currentSession)return;
  const deal=savedDealsCache.find(d=>d.id===dealId);
  const currentName=deal?dealDisplayName(deal):'';
  const newName=prompt('Rename this deal:', currentName);
  if(newName===null)return;
  try{
    const res=await fetch(`/api/deals/${dealId}/name`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+currentSession.access_token},
      body:JSON.stringify({name:newName.trim()})
    });
    const body=await res.json();
    if(!res.ok)throw new Error(body.error||'Could not rename deal.');
    loadSavedDeals();
  }catch(e){
    alert('Could not rename deal: '+e.message);
  }
}

async function deleteDeal(dealId){
  if(!currentSession)return;
  const deal=savedDealsCache.find(d=>d.id===dealId);
  const msg=(deal&&deal.pipeline_stage)
    ?`"${dealDisplayName(deal)}" (${capitalize(deal.pipeline_stage)}) is in your pipeline, so deleting removes it from there too. Delete anyway?`
    :'Delete this saved deal?';
  if(!confirm(msg))return;
  try{
    const res=await fetch(`/api/deals/${dealId}/delete`,{
      method:'POST',
      headers:{'Authorization':'Bearer '+currentSession.access_token}
    });
    const body=await res.json();
    if(!res.ok)throw new Error(body.error||'Could not delete deal.');
    loadSavedDeals();
  }catch(e){
    alert('Could not delete deal: '+e.message);
  }
}

const DEAL_TO_PORTFOLIO_TYPE={btl:'BTL',hmo:'HMO',sa:'SA',flip:'Flip'};
let movingDealId=null;

// Maps a saved deal onto the portfolio's add-property fields. Only reads
// fields calc-engine.js already computes and stores in deal_data (never
// re-derives a BTL/HMO/SA formula) — running costs come from subtracting
// the deal's own "cash purchase" net-monthly figure (cNm/cCFm) from its
// rent, which recovers management+insurance+maintenance (+ HMO's
// bills/wifi/council tax) without reimplementing any of those individually.
// address is always left blank — deal_data.name is either a real user
// title or an auto-generated "BTL — £140,000 — 15 Jul 2026" string with no
// reliable way to tell which, so guessing from it would often be wrong.
function mapDealToPortfolio(deal){
  const d=deal.deal_data||{};
  const type=deal.deal_type;
  const result={
    address:'',
    price_paid:d.pp!=null?d.pp:'',
    property_type:DEAL_TO_PORTFOLIO_TYPE[type]||'BTL',
    monthly_rent:'',
    monthly_running_costs:'',
    monthly_mortgage:d.monthlyPayment!=null?Math.round(d.monthlyPayment):''
  };
  if(type==='btl'){
    if(d.rent!=null)result.monthly_rent=d.rent;
    if(d.rent!=null&&d.cNm!=null)result.monthly_running_costs=Math.round(d.rent-d.cNm);
  }else if(type==='hmo'){
    if(d.totalRent!=null)result.monthly_rent=d.totalRent;
    if(d.totalRent!=null&&d.cNm!=null)result.monthly_running_costs=Math.round(d.totalRent-d.cNm);
  }else if(type==='sa'){
    if(d.annualRevenue!=null)result.monthly_rent=Math.round(d.annualRevenue/12);
    if(d.annualRevenue!=null&&d.cCFm!=null)result.monthly_running_costs=Math.round(d.annualRevenue/12-d.cCFm);
  }
  return result;
}

function openMoveToPortfolio(dealId){
  const deal=savedDealsCache.find(d=>d.id===dealId);
  if(!deal)return;
  movingDealId=dealId;

  const mapped=mapDealToPortfolio(deal);
  document.getElementById('mtp-address').value=mapped.address;
  document.getElementById('mtp-price').value=mapped.price_paid;
  setDDValue('mtp-type', mapped.property_type, mapped.property_type);
  document.getElementById('mtp-rent').value=mapped.monthly_rent;
  document.getElementById('mtp-costs').value=mapped.monthly_running_costs;
  document.getElementById('mtp-mortgage').value=mapped.monthly_mortgage;

  const msg=document.getElementById('mtp-msg');
  msg.innerHTML='';msg.className='save-msg';
  const btn=document.getElementById('mtp-confirm-btn');
  btn.style.display='';btn.disabled=false;btn.textContent='Add to portfolio';

  document.getElementById('mtp-modal-overlay').classList.add('open');
}

function closeMoveToPortfolio(){
  document.getElementById('mtp-modal-overlay').classList.remove('open');
  movingDealId=null;
}

function handleMtpOverlayClick(e){
  if(e.target.id==='mtp-modal-overlay')closeMoveToPortfolio();
}

document.addEventListener('keydown', function(e){
  if(e.key==='Escape')closeMoveToPortfolio();
});

async function confirmMoveToPortfolio(){
  if(!movingDealId||!currentSession)return;
  const msg=document.getElementById('mtp-msg');
  const btn=document.getElementById('mtp-confirm-btn');
  msg.className='save-msg';msg.innerHTML='';

  const payload={
    address:document.getElementById('mtp-address').value.trim(),
    price_paid:document.getElementById('mtp-price').value,
    property_type:getDDValue('mtp-type'),
    monthly_rent:document.getElementById('mtp-rent').value,
    monthly_running_costs:document.getElementById('mtp-costs').value,
    monthly_mortgage:document.getElementById('mtp-mortgage').value
  };

  btn.disabled=true;btn.textContent='Adding...';
  try{
    const res=await fetch('/api/portfolio',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+currentSession.access_token},
      body:JSON.stringify(payload)
    });
    const body=await res.json();
    if(res.status===403){
      msg.innerHTML=escapeHtml(body.error||'Upgrade to unlock the portfolio.')+' <a href="/portfolio.html">Upgrade →</a>';
      msg.className='save-msg error';
      btn.disabled=false;btn.textContent='Add to portfolio';
      return;
    }
    if(!res.ok)throw new Error(body.error||'Could not add to portfolio.');

    msg.innerHTML='Added ✓. <a href="/portfolio.html">View in portfolio →</a>';
    msg.className='save-msg success';
    btn.style.display='none';
  }catch(e){
    msg.textContent=e.message;msg.className='save-msg error';
    btn.disabled=false;btn.textContent='Add to portfolio';
  }
}

async function init(){
  const auth=await requireAuth();
  if(!auth)return;
  sbClient=auth.client;
  currentSession=auth.session;

  document.getElementById('auth-link').onclick=function(e){e.preventDefault();logout();};
  document.getElementById('app').style.display='block';

  loadSavedDeals();

  sbClient.auth.onAuthStateChange((_event, session)=>{
    currentSession=session;
    if(!currentSession){window.location.href='/';return;}
  });
}

init();
</script>
</body>
</html>
