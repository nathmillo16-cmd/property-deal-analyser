<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Log in or sign up · PROPulsion</title>
<meta name="description" content="Log in to PROPulsion or create a free account to analyse, save and track UK property deals.">
<!-- Share previews. __SITE_ORIGIN__ is filled in by server.js with the site's own address when the page is served. -->
<link rel="canonical" href="__SITE_ORIGIN__/login.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="PROPulsion">
<meta property="og:title" content="Log in or sign up · PROPulsion">
<meta property="og:description" content="Log in to PROPulsion or create a free account to analyse, save and track UK property deals.">
<meta property="og:url" content="__SITE_ORIGIN__/login.html">
<meta property="og:image" content="__SITE_ORIGIN__/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="PROPulsion: analyse, value and track UK property deals">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="shortcut icon" href="/assets/favicon.ico">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* page-specific layout only — colours/fonts/radius all come from styles.css.
   .card below is the same shared component used everywhere else; we only
   add the width constraint + elevation a standalone centred card needs. */
body{display:flex;align-items:center;justify-content:center;padding:1.5rem}
/* Indigo-tinted wash behind everything, deliberately visible now (not a
   near-white hint) — a diagonal "dawn" wash plus a subtle repeating dot
   texture. Purely decorative, layered under .bg-decor's blobs and the card
   via normal paint order (a body background always paints behind its own
   children), so none of this needs a z-index of its own. Multiple
   background-image layers, each with its own background-size/-repeat
   entry at the matching comma position — the dot layer (24px tiles) is
   listed last so it repeats while the two washes stay single, large,
   non-repeating gradients. */
body.theme-light{
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 1100px 900px at 8% 0%, rgba(75,69,178,.22), transparent 55%),
    radial-gradient(ellipse 1000px 850px at 100% 100%, rgba(164,158,224,.20), transparent 55%),
    linear-gradient(160deg, rgba(75,69,178,.08) 0%, transparent 45%),
    radial-gradient(circle, rgba(75,69,178,.07) 1px, transparent 1px);
  background-size:auto, auto, auto, 24px 24px;
  background-repeat:no-repeat, no-repeat, no-repeat, repeat;
}

/* Decorative background blobs — pure CSS, no assets. Fixed + inset:0 takes
   this fully out of document flow (can never affect page scroll height/
   width regardless of blob size or offset), its own overflow:hidden clips
   anything that pokes past the viewport edge, and z-index:-1 puts it
   behind the normal page content by default — including .card, which is
   left completely untouched (no z-index/position added to it at all).
   pointer-events:none on the wrapper is enough; children inherit it.
   Card contrast is structurally guaranteed regardless of blob strength:
   .card paints an opaque --surface background on top, in front of this
   whole layer, so it always reads crisp no matter how strong the glow
   around it gets. */
.bg-decor{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.bg-blob{position:absolute;border-radius:50%;filter:blur(100px)}
.bg-blob-1{width:640px;height:640px;top:-180px;left:-160px;background:var(--accent);opacity:.6}
.bg-blob-2{width:580px;height:580px;bottom:-200px;right:-140px;background:#a49ee0;opacity:.55}
.bg-blob-3{width:440px;height:440px;top:32%;right:4%;background:#c7c4ea;opacity:.4}
@media(max-width:600px){
  .bg-blob-1{width:420px;height:420px;top:-120px;left:-130px}
  .bg-blob-2{width:380px;height:380px;bottom:-140px;right:-110px}
  .bg-blob-3{display:none}
}

.card{max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4)}
/* .card's background/border/radius come from the shared .card rule
   (styles.css), which is already fully token-driven (background:var(--surface);
   border:1px solid var(--hairline)) — this just adds the same rgba(0,0,0,.09)
   border + 14px radius + soft shadow treatment every other migrated page's
   cards use. The strong drop-shadow above is unchanged — it's theme-neutral
   (a dark shadow reads fine dropped under a light card too, same as the
   modal cards on other pages). */
body.theme-light .card{
  border:1px solid rgba(0,0,0,.09);
  border-radius:14px;
}

.card-logo{text-align:center;margin:0 0 1.5rem}
.card-logo img{height:44px;width:auto}

.tabs{display:flex;gap:8px;margin-bottom:1.5rem}
.tab{
  flex:1;padding:9px 0;border:1.5px solid var(--hairline);border-radius:var(--radius);
  font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;
  background:var(--surface-2);color:var(--muted);
}
.tab.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{display:none}
.panel.active{display:block}

.f{display:flex;flex-direction:column;gap:6px;margin-bottom:1rem}
.f label{font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--input-muted)}
.f input{
  border:1.5px solid var(--input-hairline);border-radius:var(--radius-sm);padding:10px 12px;
  font-size:14px;background:var(--input-surface);color:var(--input-ink);width:100%;
  font-family:var(--font-body);
}
.f input:focus{outline:none;border-color:var(--input-accent)}

.submit-btn{
  width:100%;padding:12px;background:var(--accent);color:var(--accent-ink);
  border:none;border-radius:var(--radius);font-size:14px;font-weight:700;
  font-family:var(--font-body);cursor:pointer;margin-top:.25rem;
}
.submit-btn:hover{opacity:.88}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
body.theme-light .submit-btn{box-shadow:0 1px 2px rgba(75,69,178,.3)}

.msg{
  margin-top:1rem;font-size:13px;line-height:1.5;padding:.7rem .85rem;
  border-radius:var(--radius-sm);display:none;font-family:var(--font-body);
}
.msg.show{display:block}
.msg.success{background:rgba(224,164,88,.12);color:var(--accent-2)}
.msg.error{background:rgba(232,116,107,.12);color:#E8746B}
body.theme-light .msg.success{background:var(--success-bg);color:var(--success)}
body.theme-light .msg.error{background:var(--danger-bg);color:var(--danger)}
.msg.info{background:rgba(224,164,88,.12);color:var(--accent-2)}
body.theme-light .msg.info{background:var(--warn-bg);color:var(--warn-ink)}
.link{font-size:12px;color:var(--accent);text-decoration:none;cursor:pointer;display:inline-block;margin-top:.75rem;font-family:var(--font-body)}
.link:hover{text-decoration:underline}
.link-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.link-row .link-muted:only-child{margin-left:auto;margin-right:auto}
.link-muted{color:var(--muted)}
.legal-note{font-size:12px;line-height:1.5;color:var(--muted);text-align:center;margin:.85rem 0 0;font-family:var(--font-body)}
.legal-note a{color:var(--accent);text-decoration:none;font-weight:600}
/* Phones: the small text links get a 44px tap area without looking bigger. */
@media(max-width:760px){
  .link-row .link{min-height:44px;display:inline-flex;align-items:center;padding:0 .35rem;margin-top:.25rem}
  .legal-note a{display:inline-flex;align-items:center;min-height:44px;vertical-align:middle;margin:-12px 0}
}
.legal-note a:hover{text-decoration:underline}
</style>
</head>
<body class="theme-light">
  <div class="bg-decor" aria-hidden="true">
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>
    <div class="bg-blob bg-blob-3"></div>
  </div>
  <div class="card">
    <div class="card-logo"><img src="/assets/propulsion-logo.png" alt="PROPulsion"></div>
    <div class="tabs">
      <button type="button" class="tab active" id="tab-login" onclick="switchMode('login')">Log in</button>
      <button type="button" class="tab" id="tab-signup" onclick="switchMode('signup')">Sign up</button>
    </div>

    <div class="panel active" id="panel-login">
      <form id="form-login">
        <div class="f"><label for="login-email">Email</label><input type="email" id="login-email" required autocomplete="email"/></div>
        <div class="f"><label for="login-password">Password</label><input type="password" id="login-password" required autocomplete="current-password"/></div>
        <button type="submit" class="submit-btn" id="btn-login">Log in</button>
      </form>
      <div class="msg" id="msg-login"></div>
      <button type="button" class="submit-btn" id="btn-resend" style="display:none;margin-top:.6rem;background:transparent;color:var(--accent);border:1.5px solid var(--accent)" onclick="resendConfirmation()">Resend confirmation email</button>
      <div class="link-row">
        <a class="link" href="#" onclick="event.preventDefault();switchMode('forgot')">Forgot password?</a>
        <a class="link link-muted" href="/">Back to home</a>
      </div>
    </div>

    <div class="panel" id="panel-signup">
      <form id="form-signup">
        <div class="f"><label for="signup-first-name">First name (optional)</label><input type="text" id="signup-first-name" autocomplete="given-name" maxlength="60"/></div>
        <div class="f"><label for="signup-email">Email</label><input type="email" id="signup-email" required autocomplete="email"/></div>
        <div class="f"><label for="signup-password">Password</label><input type="password" id="signup-password" required minlength="6" autocomplete="new-password"/></div>
        <button type="submit" class="submit-btn" id="btn-signup">Sign up</button>
      </form>
      <!-- TODO: add "our <a href="/terms.html">Terms</a> and" once terms.html exists. -->
      <p class="legal-note">By signing up you agree to our <a href="/privacy.html">Privacy Policy</a>.</p>
      <div class="msg" id="msg-signup"></div>
      <div class="link-row">
        <a class="link link-muted" href="/">Back to home</a>
      </div>
    </div>

    <div class="panel" id="panel-forgot">
      <form id="form-forgot">
        <div class="f"><label for="forgot-email">Email</label><input type="email" id="forgot-email" required autocomplete="email"/></div>
        <button type="submit" class="submit-btn" id="btn-forgot">Send reset email</button>
      </form>
      <div class="msg" id="msg-forgot"></div>
      <a class="link" href="#" onclick="event.preventDefault();switchMode('login')">Back to log in</a>
    </div>

    <div class="panel" id="panel-mfa">
      <p style="font-size:14px;font-weight:600;margin:0 0 .35rem">Two-step sign in</p>
      <p style="font-size:13px;color:var(--muted);margin:0 0 1rem;line-height:1.5">Enter the 6-digit code from your authenticator app.</p>
      <form id="form-mfa">
        <div class="f"><label for="mfa-code">Code</label><input type="text" id="mfa-code" required inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" style="letter-spacing:.3em;font-size:18px"/></div>
        <button type="submit" class="submit-btn" id="btn-mfa">Verify</button>
      </form>
      <div class="msg" id="msg-mfa"></div>
      <a class="link" href="#" onclick="event.preventDefault();cancelMfa()">Use a different account</a>
    </div>

    <div class="panel" id="panel-reset">
      <form id="form-reset">
        <div class="f"><label for="reset-password">New password</label><input type="password" id="reset-password" required minlength="6" autocomplete="new-password"/></div>
        <div class="f"><label for="reset-password-confirm">Confirm new password</label><input type="password" id="reset-password-confirm" required minlength="6" autocomplete="new-password"/></div>
        <button type="submit" class="submit-btn" id="btn-reset">Set new password</button>
      </form>
      <div class="msg" id="msg-reset"></div>
    </div>
  </div>

<script>
let client;

function switchMode(mode){
  document.getElementById('tab-login').classList.toggle('active', mode==='login');
  document.getElementById('tab-signup').classList.toggle('active', mode==='signup');
  document.getElementById('panel-login').classList.toggle('active', mode==='login');
  document.getElementById('panel-signup').classList.toggle('active', mode==='signup');
  document.getElementById('panel-forgot').classList.toggle('active', mode==='forgot');
  document.getElementById('panel-mfa').classList.remove('active');
  document.querySelector('.tabs').style.display=(mode==='login'||mode==='signup')?'flex':'none';
}

function showResetPanel(){
  document.querySelector('.tabs').style.display='none';
  document.getElementById('panel-login').classList.remove('active');
  document.getElementById('panel-signup').classList.remove('active');
  document.getElementById('panel-forgot').classList.remove('active');
  document.getElementById('panel-reset').classList.add('active');
}

function showMsg(id, text, type){
  const el=document.getElementById(id);
  el.textContent=text;
  el.className='msg show '+type;
}

async function init(){
  const res = await fetch(API_BASE+'/api/config');
  const cfg = await res.json();
  client = supabase.createClient(cfg.supabaseUrl, cfg.supabasePublishableKey);

  // A password-recovery link also establishes a session via the URL hash —
  // don't let the "already logged in" redirect below hijack that flow before
  // the PASSWORD_RECOVERY handler gets to show the set-new-password panel.
  const isRecovery=location.hash.includes('type=recovery');

  // Sent here because the server refused this browser's session (it expired,
  // or the account was deleted). Clear what's left of it on this device so
  // the "already logged in" redirect below can't send the user straight
  // back into the app, then ask them to log in again.
  const sessionEnded=new URLSearchParams(location.search).get('session')==='ended';
  if(sessionEnded&&!isRecovery){
    try{ await client.auth.signOut({scope:'local'}); }catch(e){}
    showMsg('msg-login', 'Your session ended, please log in again.', 'info');
  }

  if(!isRecovery&&!sessionEnded){
    const { data:{ session } } = await client.auth.getSession();
    if(session){
      // Signed in with a password but two-step sign in still to do.
      if(await needsMfa()){ showMfaPanel(); return; }
      window.location.href='/home.html';
      return;
    }
  }

  if(new URLSearchParams(location.search).get('mode')==='signup'){
    switchMode('signup');
  }

  client.auth.onAuthStateChange((event, session)=>{
    if(event==='PASSWORD_RECOVERY'){
      showResetPanel();
    }
  });
}

document.getElementById('form-login').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('btn-login');
  const resendBtn=document.getElementById('btn-resend');
  const email=document.getElementById('login-email').value;
  const password=document.getElementById('login-password').value;
  resendBtn.style.display='none';
  btn.disabled=true;btn.textContent='Logging in...';
  const { error } = await client.auth.signInWithPassword({ email, password });
  btn.disabled=false;btn.textContent='Log in';
  if(error){
    if(error.code==='email_not_confirmed'){
      showMsg('msg-login', "Your email isn't confirmed yet.", 'error');
      resendBtn.style.display='block';
    }else{
      showMsg('msg-login', error.message, 'error');
    }
  }else if(await needsMfa()){
    showMfaPanel();
  }else{
    window.location.href='/home.html';
  }
});

// Two-step sign in (Settings > Security): Supabase's built-in MFA with an
// authenticator app. After the password the session is one step (aal1);
// someone who has turned it on needs the code to reach two (aal2).
async function needsMfa(){
  try{
    const { data, error } = await client.auth.mfa.getAuthenticatorAssuranceLevel();
    if(error||!data)return false;
    return data.nextLevel==='aal2'&&data.currentLevel!=='aal2';
  }catch(e){ return false; }
}
function showMfaPanel(){
  document.querySelector('.tabs').style.display='none';
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-mfa'));
  setTimeout(()=>document.getElementById('mfa-code').focus(),50);
}
async function cancelMfa(){
  await client.auth.signOut();
  document.getElementById('mfa-code').value='';
  switchMode('login');
}
document.getElementById('form-mfa').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('btn-mfa');
  const code=document.getElementById('mfa-code').value.trim();
  if(!/^\d{6}$/.test(code)){ showMsg('msg-mfa','Enter the 6-digit code.','error'); return; }
  btn.disabled=true;btn.textContent='Checking...';
  try{
    const { data:factors, error:listErr } = await client.auth.mfa.listFactors();
    if(listErr)throw listErr;
    const factor=(factors.totp||[]).find(f=>f.status==='verified');
    if(!factor)throw new Error('No authenticator app is set up on this account.');
    const { error } = await client.auth.mfa.challengeAndVerify({ factorId:factor.id, code });
    if(error)throw new Error("That code didn't work. Codes change every 30 seconds, so try the newest one.");
    window.location.href='/home.html';
  }catch(err){
    btn.disabled=false;btn.textContent='Verify';
    showMsg('msg-mfa', err.message, 'error');
  }
});

async function resendConfirmation(){
  const btn=document.getElementById('btn-resend');
  const email=document.getElementById('login-email').value;
  btn.disabled=true;btn.textContent='Sending...';
  const { error } = await client.auth.resend({ type:'signup', email });
  btn.disabled=false;btn.textContent='Resend confirmation email';
  if(error){
    showMsg('msg-login', error.message, 'error');
  }else{
    showMsg('msg-login', 'New confirmation email sent. Check your inbox.', 'success');
  }
}

document.getElementById('form-forgot').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('btn-forgot');
  const email=document.getElementById('forgot-email').value;
  btn.disabled=true;btn.textContent='Sending...';
  const { error } = await client.auth.resetPasswordForEmail(email, {
    redirectTo: BACKEND_URL+'/login.html'
  });
  btn.disabled=false;btn.textContent='Send reset email';
  if(error){
    showMsg('msg-forgot', error.message, 'error');
  }else{
    showMsg('msg-forgot', 'Password reset email sent. Check your inbox.', 'success');
  }
});

document.getElementById('form-reset').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('btn-reset');
  const password=document.getElementById('reset-password').value;
  const confirmPassword=document.getElementById('reset-password-confirm').value;
  if(password!==confirmPassword){
    showMsg('msg-reset', 'Passwords do not match.', 'error');
    return;
  }
  btn.disabled=true;btn.textContent='Saving...';
  const { error } = await client.auth.updateUser({ password });
  btn.disabled=false;btn.textContent='Set new password';
  if(error){
    showMsg('msg-reset', error.message, 'error');
  }else{
    history.replaceState(null,'',location.pathname);
    window.location.href='/home.html';
  }
});

document.getElementById('form-signup').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('btn-signup');
  const email=document.getElementById('signup-email').value;
  const password=document.getElementById('signup-password').value;
  // Optional. Kept on the auth user's metadata (no session exists yet to
  // write the profile), then copied to profiles.name by Home on first login.
  const firstName=document.getElementById('signup-first-name').value.trim();
  btn.disabled=true;btn.textContent='Signing up...';
  // The confirmation link brings them back to the login page on our own site
  // (BACKEND_URL in app-config.js), not whatever Supabase's default is.
  const options={ emailRedirectTo: BACKEND_URL+'/login.html' };
  if(firstName) options.data={ first_name:firstName };
  const { error } = await client.auth.signUp({ email, password, options });
  btn.disabled=false;btn.textContent='Sign up';
  if(error){
    showMsg('msg-signup', error.message, 'error');
  }else{
    showMsg('msg-signup', 'Check your email to confirm your account before logging in.', 'success');
    document.getElementById('form-signup').reset();
  }
});

init();
</script>
</body>
</html>
