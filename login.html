<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Deals N Yields — Log In / Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* page-specific layout only — colours/fonts/radius all come from styles.css.
   .card below is the same shared component used everywhere else; we only
   add the width constraint + elevation a standalone centred card needs. */
body{display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4)}

h1{font-family:var(--font-head);font-weight:800;font-size:22px;text-align:center;margin:0 0 1.5rem;letter-spacing:.02em}

.tabs{display:flex;gap:8px;margin-bottom:1.5rem}
.tab{
  flex:1;padding:9px 0;border:1.5px solid var(--hairline);border-radius:var(--radius);
  font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;
  background:var(--surface-2);color:var(--muted);
}
.tab.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.panel{display:none}
.panel.active{display:block}

.f{display:flex;flex-direction:column;gap:6px;margin-bottom:1rem}
.f label{font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--input-muted)}
.f input{
  border:1.5px solid var(--input-hairline);border-radius:var(--radius-sm);padding:10px 12px;
  font-size:14px;background:var(--input-surface);color:var(--input-ink);width:100%;
  font-family:var(--font-body);
}
.f input:focus{outline:none;border-color:var(--input-accent)}

.submit-btn{
  width:100%;padding:12px;background:var(--accent);color:var(--accent-ink);
  border:none;border-radius:var(--radius);font-size:14px;font-weight:700;
  font-family:var(--font-body);cursor:pointer;margin-top:.25rem;
}
.submit-btn:hover{opacity:.88}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}

.msg{
  margin-top:1rem;font-size:13px;line-height:1.5;padding:.7rem .85rem;
  border-radius:var(--radius-sm);display:none;font-family:var(--font-body);
}
.msg.show{display:block}
.msg.success{background:rgba(224,164,88,.12);color:var(--accent-2)}
.msg.error{background:rgba(232,116,107,.12);color:#E8746B}
.link{font-size:12px;color:var(--accent);text-decoration:none;cursor:pointer;display:inline-block;margin-top:.75rem;font-family:var(--font-body)}
.link:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="card">
    <h1>Deals N Yields</h1>
    <div class="tabs">
      <button type="button" class="tab active" id="tab-login" onclick="switchMode('login')">Log In</button>
      <button type="button" class="tab" id="tab-signup" onclick="switchMode('signup')">Sign Up</button>
    </div>

    <div class="panel active" id="panel-login">
      <form id="form-login">
        <div class="f"><label>Email</label><input type="email" id="login-email" required autocomplete="email"/></div>
        <div class="f"><label>Password</label><input type="password" id="login-password" required autocomplete="current-password"/></div>
        <button type="submit" class="submit-btn" id="btn-login">Log In</button>
      </form>
      <div class="msg" id="msg-login"></div>
      <button type="button" class="submit-btn" id="btn-resend" style="display:none;margin-top:.6rem;background:transparent;color:var(--accent);border:1.5px solid var(--accent)" onclick="resendConfirmation()">Resend confirmation email</button>
      <a class="link" href="#" onclick="event.preventDefault();switchMode('forgot')">Forgot password?</a>
    </div>

    <div class="panel" id="panel-signup">
      <form id="form-signup">
        <div class="f"><label>Email</label><input type="email" id="signup-email" required autocomplete="email"/></div>
        <div class="f"><label>Password</label><input type="password" id="signup-password" required minlength="6" autocomplete="new-password"/></div>
        <button type="submit" class="submit-btn" id="btn-signup">Sign Up</button>
      </form>
      <div class="msg" id="msg-signup"></div>
    </div>

    <div class="panel" id="panel-forgot">
      <form id="form-forgot">
        <div class="f"><label>Email</label><input type="email" id="forgot-email" required autocomplete="email"/></div>
        <button type="submit" class="submit-btn" id="btn-forgot">Send reset email</button>
      </form>
      <div class="msg" id="msg-forgot"></div>
      <a class="link" href="#" onclick="event.preventDefault();switchMode('login')">Back to log in</a>
    </div>

    <div class="panel" id="panel-reset">
      <form id="form-reset">
        <div class="f"><label>New password</label><input type="password" id="reset-password" required minlength="6" autocomplete="new-password"/></div>
        <div class="f"><label>Confirm new password</label><input type="password" id="reset-password-confirm" required minlength="6" autocomplete="new-password"/></div>
        <button type="submit" class="submit-btn" id="btn-reset">Set new password</button>
      </form>
      <div class="msg" id="msg-reset"></div>
    </div>
  </div>

<script>
let client;

function switchMode(mode){
  document.getElementById('tab-login').classList.toggle('active', mode==='login');
  document.getElementById('tab-signup').classList.toggle('active', mode==='signup');
  document.getElementById('panel-login').classList.toggle('active', mode==='login');
  document.getElementById('panel-signup').classList.toggle('active', mode==='signup');
  document.getElementById('panel-forgot').classList.toggle('active', mode==='forgot');
  document.querySelector('.tabs').style.display=(mode==='login'||mode==='signup')?'flex':'none';
}

function showResetPanel(){
  document.querySelector('.tabs').style.display='none';
  document.getElementById('panel-login').classList.remove('active');
  document.getElementById('panel-signup').classList.remove('active');
  document.getElementById('panel-forgot').classList.remove('active');
  document.getElementById('panel-reset').classList.add('active');
}

function showMsg(id, text, type){
  const el=document.getElementById(id);
  el.textContent=text;
  el.className='msg show '+type;
}

async function init(){
  const res = await fetch('/api/config');
  const cfg = await res.json();
  client = supabase.createClient(cfg.supabaseUrl, cfg.supabasePublishableKey);

  // A password-recovery link also establishes a session via the URL hash —
  // don't let the "already logged in" redirect below hijack that flow before
  // the PASSWORD_RECOVERY handler gets to show the set-new-password panel.
  const isRecovery=location.hash.includes('type=recovery');

  if(!isRecovery){
    const { data:{ session } } = await client.auth.getSession();
    if(session){
      window.location.href='/home.html';
      return;
    }
  }

  if(new URLSearchParams(location.search).get('mode')==='signup'){
    switchMode('signup');
  }

  client.auth.onAuthStateChange((event, session)=>{
    if(event==='PASSWORD_RECOVERY'){
      showResetPanel();
    }
  });
}

document.getElementById('form-login').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('btn-login');
  const resendBtn=document.getElementById('btn-resend');
  const email=document.getElementById('login-email').value;
  const password=document.getElementById('login-password').value;
  resendBtn.style.display='none';
  btn.disabled=true;btn.textContent='Logging in...';
  const { error } = await client.auth.signInWithPassword({ email, password });
  btn.disabled=false;btn.textContent='Log In';
  if(error){
    if(error.code==='email_not_confirmed'){
      showMsg('msg-login', "Your email isn't confirmed yet.", 'error');
      resendBtn.style.display='block';
    }else{
      showMsg('msg-login', error.message, 'error');
    }
  }else{
    window.location.href='/home.html';
  }
});

async function resendConfirmation(){
  const btn=document.getElementById('btn-resend');
  const email=document.getElementById('login-email').value;
  btn.disabled=true;btn.textContent='Sending...';
  const { error } = await client.auth.resend({ type:'signup', email });
  btn.disabled=false;btn.textContent='Resend confirmation email';
  if(error){
    showMsg('msg-login', error.message, 'error');
  }else{
    showMsg('msg-login', 'New confirmation email sent — check your inbox.', 'success');
  }
}

document.getElementById('form-forgot').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('btn-forgot');
  const email=document.getElementById('forgot-email').value;
  btn.disabled=true;btn.textContent='Sending...';
  const { error } = await client.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://dealsnyields.com/login.html'
  });
  btn.disabled=false;btn.textContent='Send reset email';
  if(error){
    showMsg('msg-forgot', error.message, 'error');
  }else{
    showMsg('msg-forgot', 'Password reset email sent — check your inbox.', 'success');
  }
});

document.getElementById('form-reset').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('btn-reset');
  const password=document.getElementById('reset-password').value;
  const confirmPassword=document.getElementById('reset-password-confirm').value;
  if(password!==confirmPassword){
    showMsg('msg-reset', 'Passwords do not match.', 'error');
    return;
  }
  btn.disabled=true;btn.textContent='Saving...';
  const { error } = await client.auth.updateUser({ password });
  btn.disabled=false;btn.textContent='Set new password';
  if(error){
    showMsg('msg-reset', error.message, 'error');
  }else{
    history.replaceState(null,'',location.pathname);
    window.location.href='/home.html';
  }
});

document.getElementById('form-signup').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn=document.getElementById('btn-signup');
  const email=document.getElementById('signup-email').value;
  const password=document.getElementById('signup-password').value;
  btn.disabled=true;btn.textContent='Signing up...';
  const { error } = await client.auth.signUp({ email, password });
  btn.disabled=false;btn.textContent='Sign Up';
  if(error){
    showMsg('msg-signup', error.message, 'error');
  }else{
    showMsg('msg-signup', 'Check your email to confirm your account before logging in.', 'success');
    document.getElementById('form-signup').reset();
  }
});

init();
</script>
</body>
</html>
