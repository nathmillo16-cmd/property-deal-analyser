# Checks calc-engine.js against independent maths on every pull request
# and every push to main. See tests/calc-engine.test.js. A red cross on a
# pull request means a figure changed: don't merge until it's explained.
name: Calculator maths check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  calc-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/calc-engine.test.js
